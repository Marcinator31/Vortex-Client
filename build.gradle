buildscript {
	repositories {
		mavenCentral()
		maven { url 'https://www.jitpack.io' }
		maven { url 'https://files.minecraftforge.net/maven' }
	}
	dependencies {
		//Change jitpack to moderniser when Forge uploads 1.13.2 MCPConfig
		classpath 'com.github.Chocohead:ForgeGradle:jitpack-SNAPSHOT'
	}
}

apply plugin: 'net.minecraftforge.gradle.tweaker-client'
apply plugin: 'java'

group 'com.vortex'
version '2.28.2-rift.1'
archivesBaseName = 'vortexclient-rift-1.13.2'

sourceCompatibility = 1.8
targetCompatibility = 1.8

repositories {
	mavenCentral()
	maven { url 'https://www.jitpack.io' }
}

dependencies {
	// The original Rift development artifact is no longer resolvable from its
	// historical repository. This compile-only interface comes from the supplied
	// RiftLoader 1.13.2 source and is provided by RiftLoader at runtime.
	compileOnly files('libs/rift-api-1.13.2-compileonly.jar')
}

minecraft {
	version = '1.13.2'
	mappings = 'snapshot_20181130'
	runDir = 'run'
	tweakClass = 'org.dimdev.riftloader.launch.RiftLoaderClientTweaker'
}