# Increases the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft / Fabric -- verified for 1.21.11 (Mounts of Mayhem)
# Source: fabricmc.net/2025/12/05/12111.html
minecraft_version=1.21.11
loader_version=0.18.1

# Yarn mappings -- the code is written against Yarn names, so we build
# with Yarn as well (verified: 1.21.11+build.4 exists in the Fabric maven).
yarn_mappings=1.21.11+build.4

# NOTE: from 1.21.11 onwards Mojang mappings are the recommended route.
# Yarn is no longer updated after this version.
# Loom 1.14.10 + Gradle 9.2 -- the official path for 1.21.11.
# Loom 1.14 strictly requires Gradle 9.2 (see gradle-wrapper.properties).
# For the still-obfuscated 1.21.11 the responsible plugin id is
# 'fabric-loom-remap' (see build.gradle).
loom_version=1.14.10

# Mod properties
mod_version=2.21.0
maven_group=com.vortex
archives_base_name=vortexclient

# Fabric API -- verified version for 1.21.11 (Modrinth, Feb 2026).
fabric_version=0.141.3+1.21.11
